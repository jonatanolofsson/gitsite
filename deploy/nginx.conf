# Serves what the builder publishes. Mounted at
# /etc/nginx/conf.d/default.conf in the web container.
server {
    listen 8080;
    server_name _;

    # By PATH, not by mounting /work/site. The runner publishes with an atomic
    # `mv`, which replaces the directory's inode; a subPath mount of
    # /work/site would keep pointing at the ORIGINAL inode and go on serving
    # the first build forever. Mount the parent, resolve the path per request.
    root /work/site;
    index index.html;

    # The runner rejects a symlinked OUTPUT directory, but a symlink INSIDE it
    # is carried over as it is — following it is the server's decision, not the
    # builder's. Without this, a symlink committed to the app repo can serve
    # anything the web container can read.
    disable_symlinks on;

    location / {
        try_files $uri $uri/ =404;
    }
}
